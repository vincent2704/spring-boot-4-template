# LIQUIBASE APPROACH 2: point to SQL files with migrations and separate rollback files. These are pure SQL scripts without
# liquibase formatted comments used for migration.
databaseChangeLog:
  - changeSet:
      id: 001-create-product-table
      author: vincent2704
      changes:
        - sqlFile:
            path: db.changelog/changes/001-create-product-and-orders-tables.sql
      rollback:
        - sqlFile:
            path: db.changelog/changes/rollback/001-create-product-and-orders-tables-rollback.sql
